<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personajes: hoja de vista previa</title>
<style>
  body { margin: 0; background: #2a2433; color: #f2ecff; font: 13px/1.3 monospace; }
  canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<pre id="err" style="color:#ff8080"></pre>
<canvas id="c"></canvas>
<script>addEventListener("error", e => { document.getElementById("err").textContent += (e.message || e) + " @" + (e.lineno || "") + "\n"; });</script>
<script type="module">
// Hoja de revisión de personajes: cada sprite a escala 1 (como el buffer), x3 (como se ve en un celu/compu) y x5 (detalle),
// sobre pisos parecidos a los del juego. Se abre con un servidor en gatos/: /tools/sprites-preview.html
import { buildSprites, SPR, dialogCanvas, PORTRAIT_IDS } from "../js/sprites.js";
buildSprites();
// modo detalle: ?solo=thomas,rocio&k=12 (o ?retratos&k=6)
const q = new URLSearchParams(location.search);
if (q.has("solo") || q.has("retratos")) {
  const k = +(q.get("k") || 10), ids = q.has("retratos") ? PORTRAIT_IDS : q.get("solo").split(",");
  const cv = document.getElementById("c"), g = cv.getContext("2d");
  const items = [];
  for (const id of ids) {
    if (q.has("retratos")) { items.push([id, [dialogCanvas(id)]]); continue; }
    const s = SPR[id]; const fr = [...s.f]; if (s.anim && s.anim.caido) fr.push(SPR[s.anim.caido].f[0]); items.push([id, fr]);
  }
  let W = 0, H = 0; const rows = [];
  let rx = 0, ry = 0, rh = 0; const maxW = 1500;
  for (const [id, fr] of items) for (const c of fr) { const w = c.width * k + 8, h = c.height * k + 8; if (rx + w > maxW) { rx = 0; ry += rh; rh = 0; } rows.push([c, rx, ry]); rx += w; rh = Math.max(rh, h); W = Math.max(W, rx); }
  H = ry + rh; cv.width = W; cv.height = H; g.imageSmoothingEnabled = false;
  g.fillStyle = "#4a6a3e"; g.fillRect(0, 0, W, H);
  for (const [c, x, y] of rows) { g.fillStyle = "#5b7a4a"; g.fillRect(x, y, c.width * k, c.height * k); g.drawImage(c, x, y, c.width * k, c.height * k); }
  throw new Error("solo-ok");
}
const cv = document.getElementById("c"), g = cv.getContext("2d");
const W = 1500;
const ROWS = [
  ["thomas", "Thomas (calle)"], ["thomasBielli", "Thomas Bielli"], ["rocio", "Rocío"], ["rocioRoros", "Rocío Roro's"],
  ["maitena", "Maitena"], ["carmelo", "Carmelo"],
  ["juli", "Juli"], ["juliano", "Juliano Benito Mostacholi"], ["chema", "el Chema"], ["amanda", "Amanda"],
  ["luz", "Luz (x2)"], ["linda", "Linda gata, jefa (x3)"], ["gataLinda", "Linda gata, aliada (x2)"],
  ["romero", "Romero"], ["gomeghooo", "Monsieur Gomeghooo"], ["caniche", "Linda caniche"], ["canicheBoss", "Linda caniche, jefa (x3)"], ["corbata", "Corbata"]
];
const floors = ["#5b7a4a", "#8a8d93", "#e8c81e"];
function floor(x, y, w, h, i) {
  const c = floors[i % floors.length]; g.fillStyle = c; g.fillRect(x, y, w, h);
  if (i % 3 === 2) { g.fillStyle = "#1c1c20"; for (let yy = 0; yy < h; yy += 24) for (let xx = (yy / 24 % 2) * 24; xx < w; xx += 48) g.fillRect(x + xx, y + yy, 24, Math.min(24, h - yy)); }
}
function rowH(s) { return Math.max((s.w * 5 > 160 ? 2 : 5) * s.h, s.w > 30 ? s.h + 20 : s.h * 3 + 20) + 40; }
let H = 40; for (const [id] of ROWS) H += rowH(SPR[id]) + 8; H += 40;
for (const [id] of ROWS) if (SPR[id].anim && SPR[id].anim.caido) H += 0;
H += 360;
cv.width = W; cv.height = H; g.imageSmoothingEnabled = false;
g.fillStyle = "#2a2433"; g.fillRect(0, 0, W, H);
g.fillStyle = "#f2ecff"; g.font = "bold 16px monospace"; g.fillText("Gatos de Linda 2.0: personajes (izq: x1 y x3 sobre piso del juego; jefas ya vienen ampliadas · der: cuadros ampliados)", 12, 24);
let y = 40;
g.font = "12px monospace";
ROWS.forEach(([id, label], i) => {
  const s = SPR[id], h = rowH(s);
  floor(0, y, 330, h, i);
  // escala real: x1 y x3, con sombra como en el juego
  const by = y + h - 10, k3 = s.w > 30 ? 1 : 3;
  g.drawImage(s.f[0], 12, by - s.h);
  const fr = s.anim && s.anim.caminar ? s.anim.caminar : [0];
  fr.slice(0, 2).forEach((k, j) => g.drawImage(j ? s.fl[k] : s.f[k], 40 + (k3 === 1 ? 30 : 0) + j * (s.w * k3 + 8), by - s.h * k3, s.w * k3, s.h * k3));
  const cd = s.anim && s.anim.caido && SPR[s.anim.caido];
  if (cd) g.drawImage(cd.f[0], 40 + 2 * (s.w * 3 + 8), by - cd.h * 3, cd.w * 3, cd.h * 3);
  g.fillStyle = "#f2ecff"; g.fillText(`${label}  ·  "${id}"  ·  ${s.f.length} cuadros  ·  ${s.w}x${s.h}`, 342, y + 13);
  const names = s.anim ? Object.entries(s.anim).filter(([k, v]) => Array.isArray(v)).map(([k, v]) => `${k}:${v.join(",")}`).join("  ") : "";
  g.fillStyle = "#b8a8d8"; g.fillText(names, 342, y + 28);
  let x = 342; const k5 = s.w * 5 > 160 ? 2 : 5;
  s.f.forEach((c, j) => { g.fillStyle = "#3a3346"; g.fillRect(x, y + 34, c.width * k5, c.height * k5); g.drawImage(c, x, y + 34, c.width * k5, c.height * k5); g.fillStyle = "#8a7aa8"; g.fillText(String(j), x + 2, y + 46); x += c.width * k5 + 6; });
  if (cd) { g.fillStyle = "#3a3346"; g.fillRect(x, y + 34, cd.w * k5, cd.h * k5); g.drawImage(cd.f[0], x, y + 34, cd.w * k5, cd.h * k5); g.fillStyle = "#8a7aa8"; g.fillText("caído", x + 2, y + 46); }
  y += h + 8;
});
// retratos de diálogo
y += 10; g.fillStyle = "#f2ecff"; g.font = "bold 16px monospace"; g.fillText("Retratos de diálogo 32x32 (x1 y x4): dialogPortrait(id, escala)", 12, y); y += 14; g.font = "12px monospace";
let x = 12;
PORTRAIT_IDS.forEach((id) => {
  const c = dialogCanvas(id);
  if (x + 140 > W) { x = 12; y += 175; }
  g.fillStyle = "#14101c"; g.fillRect(x, y, 136, 160); g.fillStyle = "#3d3352"; g.fillRect(x + 2, y + 2, 132, 132);
  g.drawImage(c, x + 4, y + 4, 128, 128); g.drawImage(c, x + 100, y + 136);
  g.fillStyle = "#f2ecff"; g.fillText(id, x + 4, y + 150);
  x += 146;
});
document.title = "ok";
</script>
</body>
</html>
